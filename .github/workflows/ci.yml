# Testes automáticos: rodam a cada envio (push) e em cada pull request.
# Se algo quebrar a navegação ou o build, o GitHub marca ❌ antes de publicar.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Tipos (TypeScript)
        run: npx tsc --noEmit
      - name: Testes da navegação
        run: npm run test:nav
      - name: Build de produção
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
